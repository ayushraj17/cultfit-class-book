name: Book CultFit Slot

on:
  schedule:
    # # Runs every day at 16:30 UTC = 10:00 PM IST
    # - cron: "30 16 * * *"
    # 🔥 TEMP: Runs once in the next 5 minutes (adjust UTC minute accordingly)
    - cron: "*/5 * * * *"  # every 5 minutes (remove after test)
  workflow_dispatch: # allow manual run

jobs:
  run-booking:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout github-actions branch
      - name: Checkout github-actions branch
        uses: actions/checkout@v4
        with:
          ref: github-actions

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4️⃣ Build TypeScript
      - name: Build project
        run: npm run build

      # 5️⃣ Run booking script with retry every 30s for 2 minutes
      - name: Run booking script
        run: |
          mkdir -p logs
          node build/index.js
        env:
          CULT_FIT_API_KEY: ${{ secrets.CULT_FIT_API_KEY }}
          CULT_FIT_APP_VERSION: ${{ secrets.CULT_FIT_APP_VERSION }}
          CULT_FIT_COOKIE: ${{ secrets.CULT_FIT_COOKIE }}
          CULT_FIT_DEVICE_ID: ${{ secrets.CULT_FIT_DEVICE_ID }}
          CULT_FIT_CENTER_ID: ${{ secrets.CULT_FIT_CENTER_ID }}

      # 6️⃣ Cleanup old logs (keep latest 7)
      - name: Cleanup old logs
        run: |
          mkdir -p logs
          ls -1t logs/booking-*.log | tail -n +8 | xargs -r rm
        shell: bash

      # 7️⃣ Upload logs as artifact
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: cultfit-logs
          path: logs/
